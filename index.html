<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Demo - Phủ sóng WiFi Đại học Nha Trang</title>

    <!-- Thư viện bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

<!-- Thanh tiêu đề -->
<header class="thanh-tieu-de">
    <div class="logo">NTU</div>
    <div class="tieu-de">
        <h1>WebGIS Demo</h1>
        <p>Phân tích và trực quan hóa mức độ phủ sóng WiFi trong khuôn viên Trường Đại học Nha Trang</p>
    </div>
    <div class="thong-tin-du-lieu">
        <span id="soDiem">15 điểm đo</span>
    </div>
</header>

<!-- Thanh công cụ lọc -->
<section class="thanh-loc">
    <div class="nhom">
        <label for="oTimKiem">Tìm theo tên điểm</label>
        <input type="text" id="oTimKiem" placeholder="Ví dụ: G5, Thư viện..." />
    </div>

    <div class="nhom">
        <label for="oChonMuc">Mức tín hiệu</label>
        <select id="oChonMuc">
            <option value="">Tất cả mức</option>
            <option value="Rất mạnh">Rất mạnh (≥ -62 dBm)</option>
            <option value="Mạnh">Mạnh (-66 → -62)</option>
            <option value="Trung bình">Trung bình (-70 → -66)</option>
            <option value="Yếu">Yếu (-75 → -70)</option>
            <option value="Rất yếu">Rất yếu (&lt; -75)</option>
        </select>
    </div>

    <div class="nhom">
        <label for="oSoSanh">Cường độ (dBm)</label>
        <div class="nhom-ngang">
            <select id="oSoSanh">
                <option value="">—</option>
                <option value="&gt;">lớn hơn</option>
                <option value="=">bằng</option>
                <option value="&lt;">nhỏ hơn</option>
            </select>
            <input type="number" id="oNhapDb" placeholder="-70" />
        </div>
    </div>

    <div class="nhom nut">
        <button id="nutLoc" class="btn btn-chinh">Lọc</button>
        <button id="nutXoa" class="btn btn-phu">Xoá</button>
    </div>

    <div class="nhom cong-tac">
        <label class="cong-tac">
            <input type="checkbox" id="batVungPhu" checked />
            <span>Vùng phủ sóng</span>
        </label>
    </div>
</section>

<!-- Bản đồ -->
<main class="khung-ban-do">
    <div id="banDo"></div>

    <!-- Bảng thống kê nổi góc trái -->
    <div class="thong-ke">
        <h3>Thống kê</h3>
        <div class="dong"><span class="cham" style="background:#006600"></span>Rất mạnh <b id="tkRatManh">0</b></div>
        <div class="dong"><span class="cham" style="background:#66cc66"></span>Mạnh <b id="tkManh">0</b></div>
        <div class="dong"><span class="cham" style="background:#ffcc00"></span>Trung bình <b id="tkTrungBinh">0</b></div>
        <div class="dong"><span class="cham" style="background:#ff9933"></span>Yếu <b id="tkYeu">0</b></div>
        <div class="dong"><span class="cham" style="background:#cc0000"></span>Rất yếu <b id="tkRatYeu">0</b></div>
    </div>
</main>

<!-- Chân trang -->
<footer class="chan-trang">
    <p>Dữ liệu: 15 điểm đo thực tế trong khuôn viên Trường Đại học Nha Trang | Bản đồ nền: OpenStreetMap</p>
</footer>

<script src="js/data.js?v=3"></script>
<script src="js/idw.js?v=3"></script>
<script src="js/map.js?v=3"></script>
</body>
</html>
